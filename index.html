<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Clientes</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--tx:#f1f5f9;--mut:#94a3b8;--acc:#22c55e;--btn:#334155;--blue:#2563eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:12px 14px 110px}
h1{font-size:20px;margin:2px 0 8px}
textarea,input,select{width:100%;background:var(--card);color:var(--tx);border:2px solid var(--line);border-radius:14px;padding:14px;font:inherit}
textarea{min-height:110px;resize:vertical}
button{background:var(--btn);color:var(--tx);border:0;border-radius:14px;padding:14px 16px;min-height:54px;font:inherit;font-weight:700;cursor:pointer}
button:active{transform:scale(.97)}
button.p{background:var(--acc);color:#052e16}
button.on{outline:3px solid var(--acc)}
.row{display:flex;gap:12px;margin:12px 0;flex-wrap:wrap}
.row>button{flex:1 1 150px}
.grow{flex:1}
small{color:var(--mut)}

/* painel rápido fixo */
#panel{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 12px;border-bottom:2px solid var(--line)}
#who{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
#nm{font-size:24px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big button{min-height:92px;background:var(--card);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.big button small{font-size:14px;font-weight:800;letter-spacing:.06em}
.big button b{font:800 clamp(20px,6vw,30px) ui-monospace,monospace;word-break:break-all}
.big button.ok{background:var(--acc);border-color:var(--acc);color:#052e16}
.big button.ok small{color:#052e16}
.nav{display:grid;grid-template-columns:1fr 1.3fr;gap:12px;margin-top:12px}
.nav button{min-height:66px;font-size:20px;border-radius:16px}
#prev{background:var(--blue);color:#fff}
#next{background:var(--acc);color:#052e16;box-shadow:0 4px 0 #15803d}
.auto{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--mut);font-size:15px}
.auto input{width:24px;height:24px;padding:0}
#kb{display:none;margin-top:8px}
@media (hover:hover) and (pointer:fine){#kb{display:block}.big button:hover{border-color:var(--acc)}.fld:hover{border-color:var(--acc)}}

details{background:var(--card);border-radius:16px;padding:14px;margin:16px 0}
summary{font-weight:800;font-size:18px;cursor:pointer;padding:6px 0}

/* cartões */
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:12px}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px;scroll-margin-top:310px}
.card.cur{border-color:var(--acc);background:#14532d33}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.num{background:var(--btn);color:var(--mut);border-radius:10px;padding:4px 10px;font-weight:800;font-size:14px}
.cur .num{background:var(--acc);color:#052e16}
.cn{font-size:22px;font-weight:800;line-height:1.2;word-break:break-word}
.fl{display:grid;gap:12px}
.fld{background:var(--bg);border:3px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:76px}
.fld small{display:block;font-size:13px;font-weight:800;letter-spacing:.06em;margin-bottom:4px}
.fld b{display:block;font:800 24px ui-monospace,monospace;word-break:break-all}
.fld.ok{background:var(--acc);border-color:var(--acc);color:#052e16}
.fld.ok small{color:#052e16}
.ca{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ca button{min-height:52px;background:var(--btn)}
.ca button[data-a=d]{background:#7f1d1d;color:#fecaca}
#t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--acc);color:#052e16;padding:14px 22px;border-radius:24px;font-weight:800;opacity:0;transition:.2s;pointer-events:none;display:flex;gap:14px;align-items:center;z-index:9;white-space:nowrap}
#t.s{opacity:1}
#t.a{pointer-events:auto}
#t button{background:#052e16;color:#fff;padding:8px 16px;min-height:44px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 10px}
input[type=file]{display:none}
</style>
</head>
<body>
<main>
<h1>📦 Clientes <small>v9</small></h1>

<div id="panel">
  <div id="who"><span id="nm">—</span><small id="pos"></small></div>
  <div class="big">
    <button id="bc"><small>🔢 CÓDIGO</small><b id="vc">—</b></button>
    <button id="bs"><small>🔑 SENHA</small><b id="vs">—</b></button>
  </div>
  <div class="nav">
    <button id="prev">◀ Anterior</button>
    <button id="next">Próximo ▶</button>
  </div>
  <label class="auto"><input type="checkbox" id="auto"> Ir para o próximo ao copiar a senha</label>
  <small id="kb">Teclado: <b>C</b> código · <b>S</b> senha · <b>↓</b> próximo · <b>↑</b> anterior · <b>/</b> buscar</small>
</div>

<div class="row">
  <input id="q" class="grow" placeholder="🔍 Buscar nome ou código  ( / )">
</div>
<div class="row">
  <button id="bo" class="on">⬇️ 1º → último</button>
  <button id="ba">🔤 A → Z</button>
  <button id="bu">⬆️ Último → 1º</button>
</div>

<details id="addbox">
  <summary>➕ Adicionar clientes</summary>
  <div class="row">
    <textarea id="in" placeholder="Um cliente por linha:&#10;Maria Souza  12345  abc.123&#10;João;98765;xyz@789"></textarea>
  </div>
  <div class="row">
    <select id="ord" class="grow">
      <option value="cs">Ordem colada: Nome · Código · Senha</option>
      <option value="sc">Ordem colada: Nome · Senha · Código</option>
    </select>
  </div>
  <div class="row">
    <button id="paste" class="p">📋 Colar e adicionar</button>
    <button id="add">➕ Adicionar do texto</button>
    <button id="plb">📊 Adicionar planilha</button>
  </div>
  <small>Planilha (.xlsx ou .csv): colunas Nome, Código e Senha, com ou sem título na 1ª linha.</small>
  <div class="row">
    <button id="exp">💾 Salvar backup</button>
    <button id="impb">📂 Restaurar backup</button>
    <button id="clr">🗑 Limpar tudo</button>
  </div>
  <input type="file" id="imp" accept=".json,application/json">
  <input type="file" id="plan" accept=".xlsx,.csv,.tsv,.txt,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
</details>

<small id="cnt"></small>
<div id="list"></div>
</main>
<div id="t"><span id="tm"></span><button id="ta" style="display:none"></button></div>

<script>
const K='clientes_v1',KC='clientes_cfg';
const $=id=>document.getElementById(id);
const clean=v=>String(v==null?'':v).replace(/\D/g,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let data=[],cfg={auto:false,ord:'cs',mode:'o'},cur=null;
try{data=JSON.parse(localStorage.getItem(K))||[]}catch(e){}
try{Object.assign(cfg,JSON.parse(localStorage.getItem(KC))||{})}catch(e){}
data.forEach(r=>{r.codigo=clean(r.codigo);r.senha=String(r.senha==null?'':r.senha);if(!r.id)r.id=uid()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(data))}catch(e){}};
const saveCfg=()=>{try{localStorage.setItem(KC,JSON.stringify(cfg))}catch(e){}};
save();
$('auto').checked=cfg.auto;$('ord').value=cfg.ord;

/* aviso */
let th;
function toast(m,label,fn){
  $('tm').textContent=m;
  const b=$('ta');
  if(label){b.style.display='';b.textContent=label;b.onclick=()=>{fn();$('t').classList.remove('s','a')}}
  else b.style.display='none';
  $('t').classList.add('s');$('t').classList.toggle('a',!!label);
  clearTimeout(th);th=setTimeout(()=>$('t').classList.remove('s','a'),label?6000:1200);
}

/* ler linhas coladas */
function parse(line){
  let p;
  if(/\t|;|\|/.test(line))p=line.split(/\t|;|\|/);
  else if((line.match(/,/g)||[]).length>=2)p=line.split(',');
  else if(/\s-\s/.test(line))p=line.split(/\s-\s/);
  else if(/\s{2,}/.test(line))p=line.trim().split(/\s{2,}/);
  else p=line.trim().split(/\s+/);
  p=p.map(s=>s.trim()).filter(Boolean);
  if(p.length<3)return null;
  const b=p.pop(),a=p.pop(),nome=p.join(' ');
  const cs=$('ord').value==='cs';
  const codigo=clean(cs?a:b),senha=(cs?b:a).trim();
  if(!codigo||!senha)return null;
  return {id:uid(),nome,codigo,senha};
}
function addText(txt){
  let n=0,bad=0;
  txt.split('\n').forEach(l=>{
    if(!l.trim())return;
    if(/nome/i.test(l)&&/senha/i.test(l))return;
    const r=parse(l);
    if(r){data.push(r);n++}else bad++;
  });
  if(n){save();$('in').value='';$('addbox').open=false}
  render();
  toast(n?`${n} adicionado(s)`+(bad?` · ${bad} ignorado(s)`:''):'Nada reconhecido');
}
$('add').onclick=()=>addText($('in').value);
$('paste').onclick=async()=>{
  try{const t=await navigator.clipboard.readText();if(t&&t.trim()){addText(t);return}}catch(e){}
  $('in').focus();toast('Cole na caixa e toque em Adicionar');
};
$('ord').onchange=()=>{cfg.ord=$('ord').value;saveCfg()};
$('auto').onchange=()=>{cfg.auto=$('auto').checked;saveCfg()};

/* planilha */
async function inflate(u8){
  const ds=new DecompressionStream('deflate-raw');
  const w=ds.writable.getWriter();w.write(u8);w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function unzip(buf){
  const v=new DataView(buf),u8=new Uint8Array(buf);
  let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){if(v.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error('zip');
  const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);
  const dec=new TextDecoder(),out={};
  for(let k=0;k<n;k++){
    if(v.getUint32(p,true)!==0x02014b50)break;
    const meth=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),off=v.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    p+=46+nl+xl+cl;
    if(!/^xl\/(sharedStrings\.xml|worksheets\/sheet\d+\.xml)$/.test(name))continue;
    const ln=v.getUint16(off+26,true),lx=v.getUint16(off+28,true),st=off+30+ln+lx;
    const raw=u8.subarray(st,st+cs);
    out[name]=dec.decode(meth===0?raw:await inflate(raw));
  }
  return out;
}
async function xlsxRows(buf){
  const z=await unzip(buf);
  const sh=Object.keys(z).filter(n=>/worksheets\//.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
  if(!sh.length)throw new Error('sheet');
  const P=new DOMParser(),ss=[];
  if(z['xl/sharedStrings.xml']){
    const d=P.parseFromString(z['xl/sharedStrings.xml'],'application/xml');
    for(const si of d.getElementsByTagName('si'))ss.push(Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join(''));
  }
  const d=P.parseFromString(z[sh[0]],'application/xml'),rows=[];
  for(const row of d.getElementsByTagName('row')){
    const arr=[];
    for(const c of row.getElementsByTagName('c')){
      const m=(c.getAttribute('r')||'').match(/^[A-Z]+/);
      let col=arr.length;
      if(m){col=0;for(const ch of m[0])col=col*26+ch.charCodeAt(0)-64;col--}
      const t=c.getAttribute('t');let val='';
      if(t==='inlineStr')val=Array.from(c.getElementsByTagName('t')).map(x=>x.textContent).join('');
      else{const vv=c.getElementsByTagName('v')[0];val=vv?vv.textContent:'';if(t==='s')val=ss[+val]||''}
      arr[col]=val;
    }
    rows.push(Array.from(arr,x=>x==null?'':String(x)));
  }
  return rows;
}
function csvRows(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split('\n')[0]||'';
  const cnt=d=>first.split(d).length;
  const delim=[';','\t',','].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=ch;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
function addRows(rows){
  rows=rows.filter(r=>r.some(c=>String(c).trim()));
  let ix=$('ord').value==='cs'?[0,1,2]:[0,2,1],start=0;
  if(rows.length){
    const h=rows[0].map(c=>String(c).trim());
    const fi=re=>h.findIndex(c=>re.test(c));
    const hn=fi(/nome|cliente/i),hc=fi(/c[oó]digo|code|^id$/i),hs=fi(/senha|password/i);
    if(hs>=0&&(hn>=0||hc>=0)){start=1;ix=[hn>=0?hn:ix[0],hc>=0?hc:ix[1],hs]}
  }
  let n=0,bad=0;
  for(const r of rows.slice(start)){
    const nome=String(r[ix[0]]==null?'':r[ix[0]]).trim(),codigo=clean(r[ix[1]]),senha=String(r[ix[2]]==null?'':r[ix[2]]).trim();
    if(!nome||!codigo||!senha){bad++;continue}
    data.push({id:uid(),nome,codigo,senha});n++;
  }
  if(n){save();$('addbox').open=false}
  render();
  toast(n?`${n} da planilha adicionado(s)`+(bad?` · ${bad} ignorado(s)`:''):'Nada reconhecido na planilha');
}
$('plb').onclick=()=>$('plan').click();
$('plan').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const buf=await f.arrayBuffer(),u=new Uint8Array(buf,0,Math.min(4,buf.byteLength));
    let rows;
    if(u[0]===0xD0&&u[1]===0xCF){toast('Salve como .xlsx ou .csv');return}
    if(u[0]===0x50&&u[1]===0x4B)rows=await xlsxRows(buf);
    else{
      let t=new TextDecoder('utf-8').decode(buf);
      if(t.includes('\uFFFD'))t=new TextDecoder('windows-1252').decode(buf);
      rows=csvRows(t);
    }
    addRows(rows);
  }catch(err){toast('Não consegui ler. Use .xlsx ou .csv')}
};

/* lista */
function view(){
  let l=data.map((r,i)=>({...r,n:i+1}));
  const q=$('q').value.trim().toLowerCase();
  if(q)l=l.filter(r=>r.nome.toLowerCase().includes(q)||r.codigo.toLowerCase().includes(q));
  if(cfg.mode==='a')l.sort((x,y)=>x.nome.localeCompare(y.nome,'pt-BR',{sensitivity:'base'}));
  if(cfg.mode==='u')l.reverse();
  return l;
}
function render(scroll){
  const l=view();
  if(!l.some(r=>r.id===cur))cur=l.length?l[0].id:null;
  $('list').innerHTML=l.length?l.map(r=>`<div class="card${r.id===cur?' cur':''}" data-id="${r.id}">
<div class="ch"><span class="num">${r.n}</span><span class="cn">${esc(r.nome)}</span></div>
<div class="fl">
<div class="fld" data-f="codigo"><small>🔢 CÓDIGO</small><b>${esc(r.codigo)}</b></div>
<div class="fld" data-f="senha"><small>🔑 SENHA</small><b>${esc(r.senha)}</b></div>
</div>
<div class="ca"><button data-a="e">✏️ Editar</button><button data-a="d">🗑 Apagar</button></div>
</div>`).join(''):'<div class="empty">Nenhum cliente ainda.<br>Abra “➕ Adicionar clientes”.</div>';
  const i=l.findIndex(r=>r.id===cur),r=l[i];
  $('nm').textContent=r?r.nome:'—';
  $('vc').textContent=r?r.codigo:'—';
  $('vs').textContent=r?r.senha:'—';
  $('pos').textContent=r?`${i+1} de ${l.length}`:'';
  $('cnt').textContent=data.length+' cliente(s)';
  [['bo','o'],['ba','a'],['bu','u']].forEach(([id,m])=>$(id).classList.toggle('on',cfg.mode===m));
  if(scroll){const el=document.querySelector('.card.cur');el&&el.scrollIntoView({block:'nearest'})}
}

/* copiar */
async function copy(v){
  try{await navigator.clipboard.writeText(v)}
  catch(e){const a=document.createElement('textarea');a.value=v;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
}
function move(d){
  const l=view();if(!l.length)return false;
  const i=l.findIndex(r=>r.id===cur),j=i+d;
  if(j<0||j>=l.length){toast(j<0?'Início da lista':'Fim da lista');return false}
  cur=l[j].id;render(true);return true;
}
async function copyField(f){
  const r=data.find(x=>x.id===cur);if(!r)return;
  await copy(r[f]);
  const b=$(f==='codigo'?'bc':'bs');b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),450);
  const fe=document.querySelector(`.card.cur .fld[data-f="${f}"]`);
  if(fe){fe.classList.add('ok');setTimeout(()=>fe.classList.remove('ok'),450)}
  toast((f==='codigo'?'Código':'Senha')+' copiado');
  if(f==='senha'&&cfg.auto)setTimeout(()=>move(1),350);
}
$('bc').onclick=()=>copyField('codigo');
$('bs').onclick=()=>copyField('senha');
$('next').onclick=()=>move(1);
$('prev').onclick=()=>move(-1);

/* toque nos cartões */
$('list').onclick=e=>{
  const card=e.target.closest('.card');if(!card)return;
  const id=card.dataset.id,f=e.target.closest('.fld'),b=e.target.closest('button[data-a]');
  cur=id;
  if(b&&b.dataset.a==='d'){
    const i=data.findIndex(x=>x.id===id),r=data[i];
    data.splice(i,1);save();render();
    toast('Cliente apagado','Desfazer',()=>{data.splice(i,0,r);save();render()});
    return;
  }
  if(b&&b.dataset.a==='e'){
    const r=data.find(x=>x.id===id);
    const v=prompt('Nome ; Código ; Senha',`${r.nome} ; ${r.codigo} ; ${r.senha}`);
    if(v){const p=v.split(';').map(s=>s.trim());if(p.length>=3){r.nome=p[0];r.codigo=clean(p[1]);r.senha=p.slice(2).join(';').trim();save()}else toast('Use: Nome ; Código ; Senha')}
    render();return;
  }
  render();
  if(f)copyField(f.dataset.f);
};

/* ordem */
$('bo').onclick=()=>{cfg.mode='o';saveCfg();render(true)};
$('ba').onclick=()=>{cfg.mode='a';saveCfg();render(true)};
$('bu').onclick=()=>{cfg.mode='u';saveCfg();render(true)};
$('q').oninput=()=>render();

/* limpar e backup */
$('clr').onclick=()=>{
  if(!data.length||!confirm('Apagar TODOS os clientes?'))return;
  const old=data;data=[];save();render();
  toast('Lista apagada','Desfazer',()=>{data=old;save();render()});
};
$('exp').onclick=()=>{
  const b=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='clientes-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('Backup salvo');
};
$('impb').onclick=()=>$('imp').click();
$('imp').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    if(!Array.isArray(j))throw 0;
    const ok=j.filter(r=>r&&r.nome!=null).map(r=>({id:uid(),nome:String(r.nome),codigo:clean(r.codigo),senha:String(r.senha==null?'':r.senha)}));
    if(!ok.length)throw 0;
    if(confirm(`Backup com ${ok.length} cliente(s).\nOK = SUBSTITUIR a lista atual\nCancelar = ADICIONAR no final`))data=ok;else data=data.concat(ok);
    save();render();toast('Backup restaurado');
  }catch(err){toast('Arquivo inválido')}
};

/* teclado (computador) */
document.addEventListener('keydown',e=>{
  const t=e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'){
    if(e.key==='Escape')e.target.blur();
    if(e.target.id==='q'&&(e.key==='Enter'||e.key==='ArrowDown')){e.preventDefault();e.target.blur()}
    return;
  }
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='c')copyField('codigo');
  else if(k==='s')copyField('senha');
  else if(k==='arrowdown'||k==='arrowright'||k==='n'||k==='j'){e.preventDefault();move(1)}
  else if(k==='arrowup'||k==='arrowleft'||k==='p'||k==='k'){e.preventDefault();move(-1)}
  else if(k==='/'){e.preventDefault();$('q').focus()}
});

render();
if('serviceWorker' in navigator){
  const had=navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window._r){window._r=1;location.reload()}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
}
</script>
</body>
</html>
